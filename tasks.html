<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        /* Estilos generales */
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Contenedor principal */
        #todo-container {
            width: 60%;
            margin: 50px auto;
            text-align: center;
            border: 4px solid white;
            padding: 20px;
            background-color: #1c1c1c;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.3);
        }

        h1 {
            font-size: 36px;
            color: #00ff7f;
        }

        /* Estilo de los campos de entrada */
        input {
            width: 80%;
            padding: 10px;
            font-size: 18px;
            margin-bottom: 10px;
            border: 2px solid white;
            border-radius: 5px;
            background-color: #333;
            color: white;
        }

        /* Estilo del botón de agregar tarea */
        button {
            padding: 10px 20px;
            font-size: 18px;
            color: black;
            background-color: #00ff7f;
            border: 4px solid white;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #00cc66;
        }

        /* Estilo de la lista de tareas */
        #task-list {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
        }

        /* Estilo de cada tarea */
        .task-item {
            background-color: #333;
            color: white;
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Botones de tarea */
        .task-item button {
            padding: 5px 10px;
            margin-left: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        /* Botón de completar tarea */
        .task-item .complete-btn {
            background-color: #00ff7f;
            color: black;
        }

        .task-item .complete-btn:hover {
            background-color: #00cc66;
        }

        /* Botón de eliminar tarea */
        .task-item .delete-btn {
            background-color: red;
            color: white;
        }

        .task-item .delete-btn:hover {
            background-color: darkred;
        }

        /* Tareas completadas */
        .completed {
            text-decoration: line-through;
            color: gray;
        }

    </style>
</head>
<body>
    <div id="todo-container">
        <h1>To-Do List</h1>
        <input type="text" id="todo-input" placeholder="Agregar una tarea...">
        <button id="add-btn">Agregar</button>
        <ul id="task-list"></ul>
    </div>

    <script>
        // Obtener las tareas desde el servidor
        async function fetchTasks() {
            const response = await fetch('http://localhost:5000/tasks');
            const tasks = await response.json();
            const taskList = document.getElementById('task-list');
            taskList.innerHTML = ''; // Limpiar la lista antes de añadir tareas

            tasks.forEach(task => {
                const taskItem = document.createElement('li');
                taskItem.classList.add('task-item');
                
                const taskSpan = document.createElement('span');
                taskSpan.textContent = task.text;
                if (task.completed) {
                    taskSpan.classList.add('completed');
                }
                
                // Botón de completar tarea
                const completeButton = document.createElement('button');
                completeButton.textContent = 'Completar';
                completeButton.classList.add('complete-btn');
                completeButton.addEventListener('click', () => completeTask(task._id));

                // Botón de eliminar tarea
                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Eliminar';
                deleteButton.classList.add('delete-btn');
                deleteButton.addEventListener('click', () => deleteTask(task._id));

                taskItem.appendChild(taskSpan);
                taskItem.appendChild(completeButton);
                taskItem.appendChild(deleteButton);
                taskList.appendChild(taskItem);
            });
        }

        // Marcar una tarea como completada
        async function completeTask(taskId) {
            const response = await fetch(`http://localhost:5000/tasks/${taskId}/complete`, {
                method: 'PUT'
            });

            if (response.ok) {
                fetchTasks(); // Actualizar la lista después de completar la tarea
            } else {
                alert("Hubo un problema al completar la tarea.");
            }
        }

        // Agregar una nueva tarea
        async function addTask() {
            const input = document.getElementById('todo-input');
            const taskText = input.value.trim();

            if (taskText === '') {
                return; // No hacer nada si el input está vacío
            }

            const response = await fetch('http://localhost:5000/tasks', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ text: taskText })
            });

            const newTask = await response.json();
            input.value = ''; // Limpiar el input
            fetchTasks(); // Actualizar la lista de tareas
        }

        // Eliminar una tarea
        async function deleteTask(taskId) {
            const response = await fetch(`http://localhost:5000/tasks/${taskId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                fetchTasks(); // Actualizar la lista después de eliminar la tarea
            } else {
                alert("Hubo un problema al eliminar la tarea.");
            }
        }

        // Event listener para el botón de agregar tarea
        document.getElementById('add-btn').addEventListener('click', addTask);

        // Cargar las tareas cuando se cargue la página
        window.onload = fetchTasks;
    </script>
</body>
</html>
