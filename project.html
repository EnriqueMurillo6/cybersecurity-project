<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List con Registro</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        #register-container {
            width: 50%;
            margin: 50px auto;
            text-align: center;
            border: 4px solid white;
            padding: 20px;
            background-color: #1c1c1c;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.3);
        }

        input {
            width: 80%;
            padding: 10px;
            font-size: large;
            margin-bottom: 10px;
            border: 2px solid white;
            border-radius: 5px;
            background-color: #2c2c2c;
            color: white;
        }

        button {
            padding: 10px 20px;
            font-size: large;
            color: black;
            background-color: #00ff7f;
            border: 4px solid white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #00cc66;
        }

        .error {
            color: red;
            display: none;
        }

        .success {
            color: green;
            display: none;
        }

        .redirect-container {
            text-align: center;
            margin-top: 20px;
        }

        .redirect-container button {
            padding: 10px 15px;
            font-size: medium;
            background-color: #00ccff;
            border: 2px solid white;
            color: black;
            cursor: pointer;
            border-radius: 5px;
        }

        .redirect-container button:hover {
            background-color: #0099cc;
        }
    </style>
</head>
<body>

    <!-- Botón de Redirección a login.html -->
    <div class="redirect-container">
        <button onclick="window.location.href='login.html'">Ir al inicio de sesión</button>
    </div>

    <!-- Contenedor de Registro -->
    <div id="register-container">
        <h1>Registro de Usuario</h1>
        <input type="text" id="register-username" placeholder="Usuario">
        <input type="password" id="register-password" placeholder="Contraseña">
        <button id="register-btn">Registrar</button>
        <p id="register-error" class="error">Error al registrar usuario. Intenta de nuevo.</p>
        <p id="register-success" class="success">Usuario registrado con éxito. ¡Ahora puedes iniciar sesión!</p>
    </div>

    <script>
        // Elementos del DOM
        const registerUsername = document.getElementById("register-username");
        const registerPassword = document.getElementById("register-password");
        const registerButton = document.getElementById("register-btn");
        const registerError = document.getElementById("register-error");
        const registerSuccess = document.getElementById("register-success");

        // Manejo del registro
        registerButton.addEventListener("click", async () => {
            const username = registerUsername.value.trim();
            const password = registerPassword.value.trim();

            // Validar los campos
            if (username === "" || password === "") {
                registerError.textContent = "Ambos campos son requeridos.";
                registerError.style.display = "block";
                registerSuccess.style.display = "none";
                return;
            }

            // Realizar la solicitud de registro al backend
            try {
                const response = await fetch('http://localhost:5000/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (response.status === 201) {
                    // Si el registro es exitoso, redirigir a login.html
                    registerSuccess.style.display = "block";
                    registerError.style.display = "none";
                    setTimeout(() => {
                        window.location.href = data.redirectTo;
                    }, 2000);
                } else {
                    // Mostrar mensaje de error
                    registerError.textContent = data.message;
                    registerError.style.display = "block";
                    registerSuccess.style.display = "none";
                }
            } catch (error) {
                console.error(error);
                registerError.textContent = "Hubo un problema al registrar el usuario.";
                registerError.style.display = "block";
                registerSuccess.style.display = "none";
            }
        });
    </script>
</body>
</html>
